name: CI

on:
  push:
    branches:
      - lab4
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - lab4
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run lint/typecheck/tests
        type: boolean
        default: true
      environment:
        description: Deployment environment
        type: choice
        options:
          - QA
          - PROD
        default: QA

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10.28.2
 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: package
          path: |
            .output/**
            dist/**
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/lab4' && 7 || 1 }}

  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_checks == true)
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_checks == true)
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_checks == true)
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build, lint, typecheck, test]
    steps:
      - run: echo "Deploying to $ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ inputs.environment }}