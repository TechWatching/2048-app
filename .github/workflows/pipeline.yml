name: Pipeline CI/CD - Lab5

on:
  push:
    branches:
      - main
      - lab4
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
      - lab4
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_analyses:
        description: 'Lancer les analyses statiques et les tests'
        type: boolean
        default: true
      environment:
        description: "Environnement cible de déploiement"
        type: choice
        options:
          - QA
          - PROD

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          
      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Installation des dépendances
        run: pnpm install
        
      - name: Build de l'application
        run: pnpm nuxi build
        
      - name: Upload de l'artifact de build
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: .output/server/index.mjs
          retention-days: 7
  
  lint:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_analyses == 'true')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec eslint "**/*.{vue,ts,js}"
      
  typecheck:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_analyses == 'true')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm nuxi prepare
      - run: pnpm vue-tsc --noEmit --project .nuxt/tsconfig.json
      
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_analyses == 'true')
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Installation des dépendances
        run: pnpm install
      - name: Exécution des tests unitaires
        run: pnpm vitest run

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: nuxt-build
          path: .output/server/
      
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - run: pnpm add -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}