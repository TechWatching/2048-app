name: Pipeline CI/CD - Lab4

on:
  push:
    branches:
      - main
      - lab4
    paths-ignore:
      - 'docs/**'

  pull_request:
    branches:
      - main
      - lab4
    paths-ignore:
      - 'docs/**'

  workflow_dispatch:
    inputs:
      run_analyses:
        description: 'Lancer les analyses statiques et les tests'
        type: boolean
        default: true
      environment:
        description: "Environnement cible de déploiement"
        type: choice
        options:
          - QA
          - PROD

env:
  NODE_VERSION: '20'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installation des dépendances
        run: pnpm install

      - name: Build de l'application
        run: pnpm build

      - name: Vérification du build
        run: |
          if [ -d ".output" ] && [ -f ".output/server/index.mjs" ]; then
            echo "Succès : Le dossier .output est valide"
          else
            echo "Erreur : Le build a échoué"
            exit 1
          fi

      - name: Upload de l'artifact de build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}

  lint-typecheck:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_analyses == true)

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installation des dépendances
        run: pnpm install

      - name: Analyse statique (linter)
        run: pnpm lint

      - name: Vérification du typage statique
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_analyses == true)

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installation des dépendances
        run: pnpm install

      - name: Exécution des tests unitaires
        run: pnpm vitest run

  # ── Job 4 : Déploiement (workflow_dispatch uniquement) ──
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Déploiement vers l'environnement cible
        run: echo "Deploying to ${{ inputs.environment }}"