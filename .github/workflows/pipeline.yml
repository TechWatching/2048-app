name: Pipeline CI/CD - Lab4

on:
  push:
    branches:
      - main
      - lab4
    paths-ignore:
      - 'docs/**'

  pull_request:
    branches:
      - main
      - lab4
    paths-ignore:
      - 'docs/**'

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Installation des dépendances
        run: pnpm install

      - name: Build de l'application
        run: pnpm build

      - name: Vérification du build
        run: |
          if [ -d ".output" ] && [ -f ".output/server/index.mjs" ]; then
            echo "Succès : Le dossier .output est valide"
          else
            echo "Erreur : Le build a échoué"
            exit 1
          fi

      - name: Upload de l'artifact de build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/
          retention-days: 7

  lint-typecheck:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Installation des dépendances
        run: pnpm install

      - name: Analyse statique (linter)
        run: pnpm lint

      - name: Vérification du typage statique
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Installation de Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Installation des dépendances
        run: pnpm install

      - name: Exécution des tests unitaires
        run: pnpm vitest run